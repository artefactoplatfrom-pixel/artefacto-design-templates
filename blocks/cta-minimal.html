<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<!-- Artefacto Block: CTA Minimal — только кнопка по центру -->
<style>
    .af-cta-minimal {
        
        
        --af-bg: #f4efe9;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;

        background: var(--af-bg);
        padding: clamp(32px, 5vw, 56px) clamp(16px, 4vw, 48px);
        text-align: center;
        font-family: var(--af-font-body);
    }

    .af-cta-minimal__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: clamp(14px, 2vw, 18px) clamp(36px, 5vw, 56px);
        border-radius: var(--af-radius-sm);
        background: var(--af-primary);
        color: #fff;
        font-family: var(--af-font-body);
        font-size: clamp(18px, 1.5vw, 20px);
        font-weight: 700;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px rgba(237, 112, 30, 0.3);
    }

    .af-cta-minimal__btn:hover {
        background: var(--af-primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(237, 112, 30, 0.4);
    }

    .af-cta-minimal__btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(237, 112, 30, 0.2);
    }

    :focus-visible { outline: 3px solid var(--af-primary); outline-offset: 3px; border-radius: 4px; }
</style>

<section class="af-cta-minimal">
    <a href="#form" class="af-cta-minimal__btn">Записаться на курс</a>
</section>
