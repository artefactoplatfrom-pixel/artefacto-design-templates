<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: Hero Centered — всё по центру, картинка снизу -->
<style>

    .af-hero-center {
        
        --af-bg: #f4efe9;
        
        
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;

        background: var(--af-bg);
        padding: clamp(32px, 5vw, 72px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
        text-align: center;
    }

    .af-hero-center__inner {
        max-width: 900px;
        margin: 0 auto;
    }

    .af-hero-center__eyebrow {
        font-size: clamp(16px, 1.5vw, 18px);
        font-weight: 600;
        color: var(--af-primary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: clamp(12px, 2vw, 20px);
    }

    .af-hero-center__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(32px, 5vw, 56px);
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: clamp(24px, 4vw, 48px);
    }

    .af-hero-center__heading strong { color: var(--af-primary); }

    .af-hero-center__desc {
        font-size: clamp(18px, 1.8vw, 20px);
        line-height: 1.7;
        color: var(--af-text-light);
        max-width: 640px;
        margin: 0 auto clamp(24px, 3vw, 36px);
    }

    .af-hero-center__buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: clamp(32px, 5vw, 56px);
    }

    .af-hero-center__btn {
    min-height: 48px;
        display: inline-flex;
        padding: clamp(12px, 2vw, 16px) clamp(28px, 4vw, 44px);
        border-radius: var(--af-radius-sm);
        font-family: var(--af-font-body);
        font-size: clamp(18px, 1.5vw, 20px);
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
    }

    .af-hero-center__btn--primary {
        background: var(--af-primary);
        color: #fff;
        border-color: var(--af-primary);
        box-shadow: 0 4px 14px rgba(237, 112, 30, 0.25);
    }

    .af-hero-center__btn--primary:hover {
        background: var(--af-primary-hover);
        transform: translateY(-3px);
        box-shadow: 0 8px 28px rgba(237, 112, 30, 0.4);
    }

    .af-hero-center__btn--primary:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(237, 112, 30, 0.2);
    }

    .af-hero-center__image img {
        width: 100%;
        max-width: 900px;
        border-radius: var(--af-radius);
        display: block;
        margin: 0 auto;
        aspect-ratio: 16/9;
        object-fit: cover;
    }
    @media (max-width: 768px) {
        .af-hero-center {
            padding: 24px 16px 32px;
        }
        .af-hero-center__heading {
            font-size: 24px;
        }
        .af-hero-center__desc {
            font-size: 16px;
        }
        .af-hero-center__buttons {
            margin-bottom: 16px;
        }
        .af-hero-center__image img {
            aspect-ratio: 16/9;
            max-height: 200px;
        }
    }
    :focus-visible{outline:3px solid var(--af-primary);outline-offset:3px;border-radius:4px;}
</style>

<div class="af-hero-center">
    <div class="af-hero-center__inner">
        <div class="af-hero-center__eyebrow">Online painting school</div>
        <h1 class="af-hero-center__heading">Learn to paint with <strong>world-class artists</strong></h1>
        <p class="af-hero-center__desc">Join live painting sessions, get personal feedback, and develop your unique artistic voice — all from the comfort of your home.</p>
        <div class="af-hero-center__buttons">
            <a href="#form" class="af-hero-center__btn af-hero-center__btn--primary">Start learning today</a>
        </div>
        <div class="af-hero-center__image">
            <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1200&h=675&fit=crop" alt="Art studio">
        </div>
    </div>
</div>
