<!-- Artefacto Block: Student Gallery — портфолио студентов (masonry с подписями) -->
<style>

    .af-student-gallery {
        
        --af-bg: #ffffff;
        
        
        --af-radius: 12px;
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;
        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
    }
    .af-student-gallery__inner { max-width: 1200px; margin: 0 auto; }
    .af-student-gallery__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(24px, 3.5vw, 40px);
        font-weight: 700; text-align: center;
        margin-bottom: clamp(24px, 4vw, 48px);
    }
    .af-student-gallery__sub {
        text-align: center; color: var(--af-text-light);
        font-size: clamp(18px, 1.5vw, 20px);
        margin-bottom: clamp(32px, 5vw, 48px);
        line-height: 1.6;
    }
    .af-student-gallery__masonry {
        columns: 3;
        column-gap: clamp(12px, 2vw, 20px);
    }
    .af-student-gallery__item {
        break-inside: avoid;
        margin-bottom: clamp(12px, 2vw, 20px);
        border-radius: var(--af-radius);
        overflow: hidden;
        position: relative;
        cursor: pointer;
    }
    .af-student-gallery__item img {
        width: 100%; display: block;
        transition: transform 0.4s ease;
    }
    .af-student-gallery__item:hover img { transform: scale(1.05); }
    .af-student-gallery__overlay {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
        opacity: 0; transition: opacity 0.3s;
        display: flex; flex-direction: column;
        justify-content: flex-end;
        padding: clamp(12px, 2vw, 20px);
    }
    .af-student-gallery__item:hover .af-student-gallery__overlay { opacity: 1; }
    .af-student-gallery__name {
        color: #fff; font-weight: 700;
        font-size: clamp(18px, 1.3vw, 20px);
    }
    .af-student-gallery__course {
        color: rgba(255,255,255,0.8);
        font-size: clamp(16px, 1.1vw, 18px);
    }

    @media (max-width: 768px) {
        .af-student-gallery__masonry { columns: 2; }
    }
    @media (max-width: 400px) {
        .af-student-gallery__masonry { columns: 1; max-width: 360px; margin: 0 auto; }
    }

    *:focus-visible {
      outline: 3px solid var(--af-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>
