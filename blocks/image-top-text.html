<!-- Artefacto Block: Image Top + Text Bottom — картинка сверху, текст снизу -->
<style>

    .af-imgtop {
        
        --af-bg: #ffffff;
        
        
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;

        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
    }

    .af-imgtop__inner {
        max-width: 900px;
        margin: 0 auto;
    }

    .af-imgtop__image img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: var(--af-radius);
        display: block;
        margin-bottom: clamp(24px, 4vw, 40px);
    }

    .af-imgtop__content {
        max-width: 720px;
        margin: 0 auto;
        text-align: center;
    }

    .af-imgtop__eyebrow {
        font-size: clamp(16px, 1.3vw, 18px);
        font-weight: 700;
        color: var(--af-primary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: clamp(8px, 1.5vw, 16px);
    }

    .af-imgtop__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(22px, 3vw, 35px);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: clamp(24px, 4vw, 48px);
    }

    .af-imgtop__text {
        font-size: clamp(18px, 1.6vw, 20px);
        line-height: 1.7;
        color: var(--af-text-light);
    }

    *:focus-visible {
      outline: 3px solid var(--af-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>

<div class="af-imgtop">
    <div class="af-imgtop__inner">
        <div class="af-imgtop__image">
            <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1000&h=562&fit=crop" alt="Art workshop">
        </div>
        <div class="af-imgtop__content">
            <div class="af-imgtop__eyebrow">Our studio</div>
            <h2 class="af-imgtop__heading">A space where creativity flows</h2>
            <p class="af-imgtop__text">Our online studio recreates the warmth and intimacy of a real atelier. Small groups, personal attention, and a community of artists who support each other's growth.</p>
        </div>
    </div>
</div>
