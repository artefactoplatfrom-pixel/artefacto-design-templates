<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: 4 Columns + Icons -->
<style>

    .af-cols4i {
        
        --af-bg: #ffffff;
        --af-card-bg: #f4efe9;
        
        
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;
        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
    }
    .af-cols4i__inner { max-width: 1200px; margin: 0 auto; }
    .af-cols4i__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(24px, 3.5vw, 40px);
        font-weight: 700;
        text-align: center;
        margin-bottom: clamp(32px, 5vw, 56px);
    }
    .af-cols4i__grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(12px, 2vw, 24px);
    }
    .af-cols4i__card {
        background: var(--af-card-bg);
        border-radius: var(--af-radius-lg);
        padding: clamp(22px, 2.5vw, 32px);
        text-align: center;
        box-shadow: var(--af-shadow-card);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .af-cols4i__card:hover {
        transform: translateY(-3px);
        box-shadow: var(--af-shadow-card-hover);
    }
    .af-cols4i__icon { width: 52px; height: 52px; border-radius: 50%; background: var(--af-orange-light); display: flex; align-items: center; justify-content: center; margin: 0 auto clamp(12px, 1.5vw, 16px); }
    .af-cols4i__icon svg { width: 26px; height: 26px; color: #8a4a12; }
    .af-cols4i__card-title {
        font-family: var(--af-font-heading);
        font-size: clamp(18px, 1.7vw, 19px);
        font-weight: 700;
        margin-bottom: 8px;
    }
    .af-cols4i__card-text {
        font-size: clamp(14px, 1.3vw, 15px);
        line-height: 1.55;
        color: var(--af-text-light);
    }
    @media (max-width: 900px) { .af-cols4i__grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .af-cols4i__grid { grid-template-columns: 1fr; } }

    *:focus-visible {
      outline: 3px solid var(--af-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>

<div class="af-cols4i">
    <div class="af-cols4i__inner">
        <h2 class="af-cols4i__heading">What makes us different</h2>
        <div class="af-cols4i__grid">
            <div class="af-cols4i__card">
                <div class="af-cols4i__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="15" height="14" rx="2.5"/><path d="m17 10 5-3v10l-5-3z"/></svg></div>
                <h3 class="af-cols4i__card-title">Live Sessions</h3>
                <p class="af-cols4i__card-text">Real-time painting with a master artist</p>
            </div>
            <div class="af-cols4i__card">
                <div class="af-cols4i__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-3.3A8.4 8.4 0 1 1 21 11.5Z"/></svg></div>
                <h3 class="af-cols4i__card-title">Personal Feedback</h3>
                <p class="af-cols4i__card-text">Individual critique of your work</p>
            </div>
            <div class="af-cols4i__card">
                <div class="af-cols4i__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M7 6V4m10 2V4M2.5 10h19"/><circle cx="12" cy="13.5" r="2.2"/></svg></div>
                <h3 class="af-cols4i__card-title">Recordings</h3>
                <p class="af-cols4i__card-text">Lifetime access to all sessions</p>
            </div>
            <div class="af-cols4i__card">
                <div class="af-cols4i__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6"/><path d="M17.5 14.5a5.5 5.5 0 0 1 3 5"/></svg></div>
                <h3 class="af-cols4i__card-title">Community</h3>
                <p class="af-cols4i__card-text">Join a group of like-minded artists</p>
            </div>
        </div>
    </div>
</div>
