<!-- Artefacto Block: Big Quote — большая цитата-отзыв -->
<style>

    .af-bigquote {
        
        --af-bg: #232020;
        --af-text: #ffffff;
        --af-text-light: rgba(255,255,255,0.85);
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;
        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
        text-align: center;
    }
    .af-bigquote__inner { max-width: 800px; margin: 0 auto; }
    .af-bigquote__mark {
        font-size: clamp(48px, 6vw, 80px);
        color: var(--af-primary);
        line-height: 1;
        margin-bottom: clamp(8px, 1.5vw, 16px);
    }
    .af-bigquote__text {
        font-family: var(--af-font-heading);
        font-size: clamp(19px, 2.8vw, 29px);
        font-weight: 400;
        font-style: italic;
        line-height: 1.6;
        margin-bottom: clamp(24px, 3vw, 36px);
    }
    .af-bigquote__author {
        display: flex;
        align-items: center;
        gap: 16px;
        justify-content: center;
    }
    .af-bigquote__avatar {
        width: clamp(48px, 6vw, 64px);
        height: clamp(48px, 6vw, 64px);
        border-radius: 50%;
        object-fit: cover;
    }
    .af-bigquote__name { font-weight: 700; font-size: clamp(18px, 1.4vw, 20px); }
    .af-bigquote__role { font-size: clamp(16px, 1.2vw, 18px); color: var(--af-text-light); }

    *:focus-visible {
      outline: 3px solid var(--af-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>

<div class="af-bigquote">
    <div class="af-bigquote__inner">
        <div class="af-bigquote__mark">"</div>
        <p class="af-bigquote__text">This intensive didn't just teach me watercolor technique — it taught me to see the world differently. Every puddle, every rain-streaked window is now a painting waiting to happen.</p>
        <div class="af-bigquote__author">
            <img class="af-bigquote__avatar" src="https://i.pravatar.cc/128?img=12" alt="Avatar">
            <div>
                <div class="af-bigquote__name">Elena Voronova</div>
                <div class="af-bigquote__role">VIP Student, Autumn 2025</div>
            </div>
        </div>
    </div>
</div>
