<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: CTA Accent — кнопка на акцентном фоне -->
<style>
    .af-cta-accent {
        
        
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;

        background: var(--af-primary);
        padding: clamp(32px, 6vw, 64px) clamp(16px, 4vw, 48px);
        text-align: center;
        font-family: var(--af-font-body);
        color: #fff;
    }

    .af-cta-accent__inner {
        max-width: 680px;
        margin: 0 auto;
    }

    .af-cta-accent__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(24px, 3.5vw, 38px);
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: clamp(12px, 2vw, 20px);
    }

    .af-cta-accent__desc {
        font-size: clamp(18px, 1.5vw, 20px);
        line-height: 1.6;
        opacity: 0.9;
        margin-bottom: clamp(20px, 3vw, 32px);
    }

    .af-cta-accent__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: clamp(14px, 2vw, 18px) clamp(32px, 5vw, 48px);
        border-radius: var(--af-radius-sm);
        background: #fff;
        color: var(--af-primary);
        font-family: var(--af-font-body);
        font-size: clamp(18px, 1.5vw, 20px);
        font-weight: 700;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .af-cta-accent__btn:hover {
        background: var(--af-text);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .af-cta-accent__btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 4px; }
</style>

<section class="af-cta-accent">
    <div class="af-cta-accent__inner">
        <h2 class="af-cta-accent__heading">Не упустите возможность!</h2>
        <p class="af-cta-accent__desc">Места ограничены — запишитесь сегодня и начните свой творческий путь.</p>
        <a href="#form" class="af-cta-accent__btn">Забронировать место</a>
    </div>
</section>
