/* ════════════════════════════════════════════════════════════════
   17. PAGE TRUNCATION FIX — страница показывает все блоки
   ════════════════════════════════════════════════════════════════
   Баг: GetCourse JS/виджеты иногда ставят overflow:hidden или
   фиксированный height на body/wrapper до рендера всех блоков,
   из-за чего видно только первый экран.
   ════════════════════════════════════════════════════════════════ */

html,
body,
.t-body,
.t-records,
.t-site-wrapper {
  overflow: visible !important;
  height: auto !important;
  min-height: 100vh !important;
}

.t-rec,
.t-rec-inner,
.block-set {
  display: block !important;
  overflow: visible !important;
  height: auto !important;
}
</style>

<!-- Page truncation fix: снимаем inline height/overflow после загрузки -->
<script>
(function() {
  function fixPageTruncation() {
    var selectors = ['html', 'body', '.t-body', '.t-records', '.t-site-wrapper'];
    selectors.forEach(function(sel) {
      var els = document.querySelectorAll(sel);
      els.forEach(function(el) {
        el.style.overflow = 'visible';
        el.style.height = 'auto';
        el.style.minHeight = '100vh';
      });
    });

    var blocks = document.querySelectorAll('.t-rec, .t-rec-inner, .block-set');
    blocks.forEach(function(el) {
      el.style.overflow = 'visible';
      el.style.height = 'auto';
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fixPageTruncation);
  } else {
    fixPageTruncation();
  }

  window.addEventListener('load', fixPageTruncation);
})();
</script>
