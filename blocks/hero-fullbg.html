<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: Hero Full Background — текст поверх фоновой картинки -->
<style>

    .af-hero-bg {
        
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;

        position: relative;
        min-height: clamp(400px, 70vh, 700px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--af-font-body);
        color: #fff;
        overflow: hidden;
    }

    .af-hero-bg__bg {
        position: absolute;
        inset: 0;
        z-index: 0;
    }

    .af-hero-bg__bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .af-hero-bg__overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.6) 100%);
        z-index: 1;
    }

    .af-hero-bg__content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        padding: clamp(32px, 5vw, 64px) clamp(16px, 4vw, 48px);
    }

    .af-hero-bg__eyebrow {
        font-size: clamp(16px, 1.4vw, 18px);
        font-weight: 600;
        color: var(--af-primary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: clamp(12px, 2vw, 20px);
    }

    .af-hero-bg__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(32px, 5vw, 56px);
        font-weight: 700;
        line-height: 1.15;
        margin-bottom: clamp(24px, 4vw, 48px);
    }

    .af-hero-bg__desc {
        font-size: clamp(18px, 1.8vw, 20px);
        line-height: 1.7;
        opacity: 0.9;
        margin-bottom: clamp(24px, 3vw, 36px);
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
    }

    .af-hero-bg__btn {
    min-height: 48px;
        display: inline-flex;
        padding: clamp(14px, 2vw, 18px) clamp(32px, 4vw, 52px);
        border-radius: var(--af-radius-sm);
        background: var(--af-primary);
        color: #fff;
        font-family: var(--af-font-body);
        font-size: clamp(18px, 1.6vw, 20px);
        font-weight: 700;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 14px rgba(237, 112, 30, 0.25);
    }

    .af-hero-bg__btn:hover {
        background: var(--af-primary-hover);
        transform: translateY(-3px);
        box-shadow: 0 8px 28px rgba(237, 112, 30, 0.4);
    }

    .af-hero-bg__btn:active {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(237, 112, 30, 0.2);
    }
    @media (max-width: 768px) {
        .af-hero-bg {
            min-height: auto;
            padding: 24px 16px 32px;
        }
        .af-hero-bg__content {
            padding: 24px 16px 32px;
            gap: 16px;
        }
        .af-hero-bg__heading {
            font-size: 24px;
        }
        .af-hero-bg__desc {
            font-size: 16px;
        }
    }
    :focus-visible{outline:3px solid var(--af-primary);outline-offset:3px;border-radius:4px;}
</style>

<div class="af-hero-bg">
    <div class="af-hero-bg__bg">
        <img src="https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=1600&h=900&fit=crop" alt="Background">
        <div class="af-hero-bg__overlay"></div>
    </div>
    <div class="af-hero-bg__content">
        <div class="af-hero-bg__eyebrow">3-day intensive</div>
        <h1 class="af-hero-bg__heading">Watercolor Masterclass with Nicolás López</h1>
        <p class="af-hero-bg__desc">Three days of live painting, personal guidance, and artistic transformation. April 2–4, 2026.</p>
        <a href="#form" class="af-hero-bg__btn">Reserve your spot</a>
    </div>
</div>
