<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: Content Card — карточка с тегом и текстом -->
<style>

    .af-contentcard {
        
        --af-bg: #f4efe9;
        --af-card-bg: #ffffff;
        
        
        --af-radius: 20px;
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;
        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
    }
    .af-contentcard__inner { max-width: 720px; margin: 0 auto; }
    .af-contentcard__card {
        position: relative;
        background: var(--af-card-bg);
        border-radius: var(--af-radius);
        padding: clamp(28px, 4vw, 44px);
        border-left: 4px solid var(--af-orange);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: var(--af-shadow-card);
    }
    .af-contentcard__card:hover {
        transform: translateY(-3px);
        box-shadow: var(--af-shadow-card-hover);
    }
    .af-contentcard__tag {
        display: inline-flex;
        align-items: center;
        font-family: var(--af-font-body);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--af-orange-bright);
        background: var(--af-orange-light);
        padding: 6px 14px;
        border-radius: var(--af-radius-pill);
        margin-bottom: clamp(14px, 2vw, 18px);
    }
    .af-contentcard__text {
        font-family: var(--af-font-heading);
        font-size: clamp(18px, 2.2vw, 21px);
        font-weight: 400;
        line-height: 1.55;
        color: var(--af-text);
    }
    .af-contentcard__text p { margin-bottom: clamp(12px, 2vw, 20px); }
    .af-contentcard__text p:last-child { margin-bottom: 0; }

    *:focus-visible {
      outline: 3px solid var(--af-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>

<div class="af-contentcard">
    <div class="af-contentcard__inner">
        <div class="af-contentcard__card">
            <div class="af-contentcard__tag">Художник на плато</div>
            <div class="af-contentcard__text">
                <p>Вы уже не новичек и ищете свой стиль, рисуете несколько лет и устали от рутины, возможно, работы не плохие — но все одинаковые.</p>
                <p>Иногда, вы видите, что результат предсказуем, когда видите работы мастера в голове вопрос: «КАК это делает?!»</p>
            </div>
        </div>
    </div>
</div>
