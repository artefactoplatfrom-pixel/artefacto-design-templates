<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<!-- Artefacto Block: Stats Animated — анимированные счётчики по скроллу -->
<style>

    .af-stats-anim {
        
        --af-bg: #232020;
        --af-text: #ffffff;
        --af-text-light: rgba(255,255,255,0.85);
        --af-font-heading: 'Source Serif 4', 'Georgia', serif;
        --af-font-body: 'Manrope', 'Helvetica Neue', sans-serif;
        background: var(--af-bg);
        padding: clamp(56px, 10vw, 120px) clamp(16px, 4vw, 48px);
        font-family: var(--af-font-body);
        color: var(--af-text);
    }
    .af-stats-anim__inner { max-width: 1100px; margin: 0 auto; }
    .af-stats-anim__heading {
        font-family: var(--af-font-heading);
        font-size: clamp(24px, 3.5vw, 40px);
        font-weight: 700; text-align: center;
        margin-bottom: clamp(24px, 4vw, 48px);
    }
    .af-stats-anim__grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(16px, 3vw, 32px);
        text-align: center;
    }
    .af-stats-anim__item {
        padding: clamp(20px, 3vw, 32px) clamp(12px, 2vw, 20px);
        border-radius: var(--af-radius-lg);
        background: rgba(255,255,255,0.05);
    }
    .af-stats-anim__icon {
        width: clamp(44px, 5vw, 56px);
        height: clamp(44px, 5vw, 56px);
        margin: 0 auto 16px;
        border-radius: 50%;
        background: rgba(247,170,71,0.16);
        display: flex; align-items: center; justify-content: center;
    }
    .af-stats-anim__icon svg { width: clamp(22px, 2.4vw, 28px); height: clamp(22px, 2.4vw, 28px); color: var(--af-orange); }
    .af-stats-anim__number {
        font-family: var(--af-font-heading);
        font-size: clamp(35px, 5vw, 54px);
        font-weight: 700; color: var(--af-primary);
        line-height: 1.1; margin-bottom: 8px;
    }
    .af-stats-anim__label {
        font-size: clamp(16px, 1.3vw, 18px);
        color: var(--af-text-light); font-weight: 500;
        line-height: 1.4;
    }

    @media (max-width: 768px) {
        .af-stats-anim__grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
        .af-stats-anim__grid { grid-template-columns: 1fr; }
    }

    *:focus-visible {
      outline: 3px solid var(--af-primary);
      outline-offset: 3px;
      border-radius: 4px;
    }
  </style>

<div class="af-stats-anim">
    <div class="af-stats-anim__inner">
        <h2 class="af-stats-anim__heading">Our results speak for themselves</h2>
        <div class="af-stats-anim__grid" id="af-stats-anim-grid">
            <div class="af-stats-anim__item">
                <div class="af-stats-anim__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4"/></svg></div>
                <div class="af-stats-anim__number" data-target="5200" data-suffix="+">0</div>
                <div class="af-stats-anim__label">Students graduated</div>
            </div>
            <div class="af-stats-anim__item">
                <div class="af-stats-anim__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m12 3 2.6 5.6 6 .7-4.4 4.1 1.2 6L12 16.8 6.6 19.4l1.2-6L3.4 9.3l6-.7L12 3Z"/></svg></div>
                <div class="af-stats-anim__number" data-target="4.9" data-decimals="1">0</div>
                <div class="af-stats-anim__label">Average rating</div>
            </div>
            <div class="af-stats-anim__item">
                <div class="af-stats-anim__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg></div>
                <div class="af-stats-anim__number" data-target="34" data-suffix="">0</div>
                <div class="af-stats-anim__label">Countries</div>
            </div>
            <div class="af-stats-anim__item">
                <div class="af-stats-anim__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"/></svg></div>
                <div class="af-stats-anim__number" data-target="87" data-suffix="%">0</div>
                <div class="af-stats-anim__label">Got hired within 3 months</div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    var grid = document.getElementById('af-stats-anim-grid');
    if (!grid) return;
    var animated = false;
    function animateCounters(){
        if (animated) return;
        animated = true;
        var els = grid.querySelectorAll('.af-stats-anim__number');
        els.forEach(function(el){
            var target = parseFloat(el.getAttribute('data-target'));
            var suffix = el.getAttribute('data-suffix') || '';
            var decimals = parseInt(el.getAttribute('data-decimals')) || 0;
            var duration = 2000;
            var start = performance.now();
            function step(now){
                var progress = Math.min((now - start) / duration, 1);
                var ease = 1 - Math.pow(1 - progress, 3);
                var current = target * ease;
                el.textContent = (decimals > 0 ? current.toFixed(decimals) : Math.floor(current).toLocaleString()) + suffix;
                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        });
    }
    var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if (e.isIntersecting) animateCounters(); });
    }, {threshold: 0.3});
    observer.observe(grid);
})();
</script>
